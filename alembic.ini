; Alembic — migrações do Postgres de produção.
; Alembic — production Postgres migrations.
;
;   alembic upgrade head        aplica tudo que falta
;   alembic downgrade -1        desfaz a última
;   alembic history             o que existe
;   alembic -x url=... upgrade head   força outra URL (é assim que o teste roda)
;
; NÃO existe `sqlalchemy.url` aqui, e é de propósito: a URL vem do ambiente
; por core/config.py. URL de banco tem senha dentro, e arquivo versionado com
; senha dentro é credencial no git.
; No sqlalchemy.url on purpose — the URL comes from the environment.

[alembic]
script_location = migrations

; Permite que migrations/env.py importe `core.config` a partir da raiz.
prepend_sys_path = .

; Separador de caminho explícito. Sem isto o Alembic 1.16+ avisa que vai cair
; no modo antigo, que quebra em caminho com espaço ou dois-pontos.
path_separator = os

; Prefixo com data ajuda a ler a ordem sem abrir arquivo.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generico

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generico

[formatter_generico]
format = %(levelname)-5.5s [%(name)s] %(message)s
