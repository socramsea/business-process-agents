name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qualidade:
    runs-on: ubuntu-latest

    strategy:
      # Não aborta as outras versões quando uma falha — queremos saber se o
      # problema é de uma versão só ou de todas.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    # O Postgres existe aqui e não na máquina de quem desenvolve. É por isso que
    # os testes da memória da empresa pulam localmente e RODAM aqui: sem este
    # serviço, o contrato do banco de produção nunca seria exercido de verdade,
    # e um portão que nunca fica vermelho não é portão.
    # Postgres lives here, not on the dev machine — this is where the corporate
    # memory contract tests actually run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentes
          POSTGRES_PASSWORD: agentes
          POSTGRES_DB: agentes_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Banco de TESTE, separado do de produção de propósito: o preparo dos
      # testes dá TRUNCATE na tabela, e core/config.py recusa rodar se as duas
      # URLs forem iguais.
      DATABASE_URL_TESTE: postgresql://agentes:agentes@localhost:5432/agentes_teste

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: ruff (estilo e pegadinhas)
        run: ruff check .

      - name: mypy (tipos)
        run: mypy .

      # Banco vazio, separado do de teste: aplicar migração num banco que já
      # tem a tabela não prova nada.
      - name: Criar um banco vazio de verdade
        run: |
          psql "postgresql://agentes:agentes@localhost:5432/agentes_teste" \
            -c "CREATE DATABASE agentes_do_zero"

      # Prova o caminho que o deploy usa: URL vinda de DATABASE_URL, sem -x.
      # Os testes exercitam o caminho do -x; este exercita o outro.
      # Proves the deploy path: URL from DATABASE_URL, no -x flag.
      - name: alembic (a migração aplica num banco do zero)
        run: alembic upgrade head
        env:
          DATABASE_URL: postgresql://agentes:agentes@localhost:5432/agentes_do_zero

      - name: pytest (comportamento)
        run: pytest -v
