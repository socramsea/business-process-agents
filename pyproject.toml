[project]
name = "business-process-agents"
version = "0.1.0"
description = "Agentes autônomos de processos de negócio sobre uma base compartilhada"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.60",
    "openai>=2.0",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # warnings
    "I",   # import order
    "UP",  # sintaxe moderna
    "B",   # bugbear: pegadinhas comuns
    "SIM", # simplificações
]

[tool.ruff.lint.per-file-ignores]
# Testes precisam mexer no sys.path antes de importar o projeto.
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Testes descrevem cenário, não precisam de anotação em toda função.
module = "tests.*"
disallow_untyped_defs = false
